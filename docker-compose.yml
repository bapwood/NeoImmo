services:
  database:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - neoimmo_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - NeoImmo-docker

  chain:
    container_name: chain
    image: ghcr.io/foundry-rs/foundry:latest
    restart: always
    entrypoint: ["anvil"]
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "10"
      - --mnemonic
      - "top proof city smart unable drink order festival flush desert umbrella social"
    ports:
      - "${HARDHAT_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast rpc ots_getApiLevel --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - NeoImmo-docker

  chain-deployer:
    container_name: chain-deployer
    build:
      context: ./crypto
      dockerfile: Dockerfile
    command: npm run deploy:local
    depends_on:
      chain:
        condition: service_healthy
    environment:
      RPC_LOCALHOST: "http://chain:8545"
      BLOCKCHAIN_MNEMONIC: "top proof city smart unable drink order festival flush desert umbrella social"
    volumes:
      - deployments:/usr/src/app/deployments
    networks:
      - NeoImmo-docker

  server:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      database:
        condition: service_healthy
      chain-deployer:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SERVER_PORT: ${SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      RPC_LOCALHOST: "http://chain:8545"
      BLOCKCHAIN_ENABLED: "true"
      BLOCKCHAIN_RPC_URL: "http://chain:8545"
      BLOCKCHAIN_MNEMONIC: "top proof city smart unable drink order festival flush desert umbrella social"
      BLOCKCHAIN_BACKEND_ACCOUNT_INDEX: "0"
      BLOCKCHAIN_TREASURY_ACCOUNT_INDEX: "1"
      BLOCKCHAIN_CHAIN_ID: "31337"
      BLOCKCHAIN_DEPLOYMENTS_FILE: "/usr/src/app/deployments/local.json"
    volumes:
      - deployments:/usr/src/app/deployments
    networks:
      - NeoImmo-docker
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  prisma-studio:
    container_name: prisma-studio
    image: node:20-alpine
    working_dir: /usr/src/app
    command: npx prisma studio --port 5555 --browser none --url "${DATABASE_URL}"
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - NeoImmo-docker
    depends_on:
      database:
        condition: service_healthy

volumes:
  neoimmo_db_data:
  deployments:

networks:
  NeoImmo-docker:
    driver: bridge